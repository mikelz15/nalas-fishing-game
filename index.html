<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Nala's Fishing Game</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06243c;
            font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: #f4fbff;
            text-shadow: 0 2px 8px rgba(0,20,40,.7);
            padding: calc(12px + env(safe-area-inset-top)) 16px 16px;
        }
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 18px;
            letter-spacing: .4px;
        }
        #scoreBox, #lives {
            font-weight: 700;
            font-size: 20px;
            background: rgba(4, 18, 32, .55);
            border: 1px solid rgba(180,230,255,.22);
            padding: 6px 12px;
            border-radius: 999px;
            backdrop-filter: blur(6px);
        }
        #scoreBox span { opacity: .75; font-size: 12px; font-weight: 600; margin-right: 6px; letter-spacing: .8px; }
        #lives { letter-spacing: 3px; font-size: 18px; }
        #combo {
            position: absolute;
            top: calc(52px + env(safe-area-inset-top));
            right: 16px;
            font-size: 16px;
            color: #ffe28a;
            opacity: 0;
            transition: opacity .15s;
        }
        #combo.on { opacity: 1; }
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(6,30,55,.55), rgba(3,12,24,.82));
            color: #f7fbff;
            text-align: center;
            padding: 24px;
        }
        #overlay.hidden { display: none; }
        #card {
            max-width: 420px;
            width: 92vw;
            background: linear-gradient(180deg, rgba(18,62,98,.72), rgba(8,28,48,.78));
            border: 1px solid rgba(180,230,255,.28);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            border-radius: 24px;
            padding: 28px 22px 26px;
            backdrop-filter: blur(10px);
        }
        #nalaTitleImg {
            width: 108px; height: 108px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            display: block;
            box-shadow: 0 0 0 3px rgba(255,255,255,.2), 0 8px 24px rgba(0,0,0,.35);
        }
        h1 {
            margin: 4px 0 6px;
            font-size: clamp(26px, 7vw, 36px);
            letter-spacing: .5px;
        }
        .sub { opacity: .85; margin: 0 0 18px; line-height: 1.45; font-size: 15px; }
        button {
            pointer-events: auto;
            appearance: none;
            border: 0;
            background: linear-gradient(180deg, #ffd56a, #f0a52a);
            color: #2a1a00;
            font-weight: 800;
            font-size: 18px;
            padding: 14px 28px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 8px 0 #c47b12, 0 12px 24px rgba(0,0,0,.25);
        }
        button:active { transform: translateY(3px); box-shadow: 0 5px 0 #c47b12, 0 8px 16px rgba(0,0,0,.2); }
        .stats { margin: 10px 0 18px; font-size: 15px; opacity: .92; }
        .hint { font-size: 13px; opacity: .7; margin-top: 14px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="topbar">
            <div id="scoreBox"><span>SCORE</span><strong id="scoreVal">0</strong></div>
            <div id="lives"></div>
        </div>
        <div id="combo">COMBO x1</div>
    </div>
    <div id="overlay">
        <div id="card">
            <img id="nalaTitleImg" alt="Nala" src="">
            <h1 id="ovTitle">Nala's Fishing Game</h1>
            <p class="sub" id="ovSub">Tap the swimming Nala-fish before they slip off the screen. Combos pay extra. Miss five and the pond goes quiet.</p>
            <div class="stats" id="ovStats"></div>
            <button id="startBtn">Cast the line</button>
            <p class="hint">Works with tap or click · add to Home Screen on iPhone</p>
        </div>
    </div>

    <script>
    const NALA_SRC = "nala-face.png";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ovTitle");
    const ovSub = document.getElementById("ovSub");
    const ovStats = document.getElementById("ovStats");
    const startBtn = document.getElementById("startBtn");
    const scoreVal = document.getElementById("scoreVal");
    const livesEl = document.getElementById("lives");
    const comboEl = document.getElementById("combo");
    document.getElementById("nalaTitleImg").src = NALA_SRC;

    const catFaceImg = new Image();
    catFaceImg.src = NALA_SRC;

    const MAX_LIVES = 5;
    const HS_KEY = "nalaFishingHighScore";

    let W = 0, H = 0, dpr = 1;
    let state = "menu";
    let fishList = [];
    let fx = [];
    let bubbles = [];
    let weeds = [];
    let score = 0;
    let lives = MAX_LIVES;
    let combo = 0;
    let lastCatch = 0;
    let spawnAcc = 0;
    let spawnEvery = 900;
    let elapsed = 0;
    let lastTs = 0;
    let shake = 0;
    let audioCtx = null;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!weeds.length) seedDecor();
    }
    window.addEventListener("resize", resize);
    resize();

    function seedDecor() {
        weeds = [];
        for (let i = 0; i < 9; i++) {
            weeds.push({
                x: (i + 0.3) * (W / 9) + Math.random() * 20,
                h: 70 + Math.random() * 110,
                phase: Math.random() * Math.PI * 2,
                w: 8 + Math.random() * 10
            });
        }
        bubbles = [];
        for (let i = 0; i < 22; i++) {
            bubbles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 1.5 + Math.random() * 4,
                s: 12 + Math.random() * 28,
                a: 0.12 + Math.random() * 0.2
            });
        }
    }

    function ensureAudio() {
        if (audioCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
    }
    function beep(freq, dur, type, vol) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol || 0.08, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + dur);
    }

    class Fish {
        constructor() {
            const difficulty = Math.min(elapsed / 75000, 1);
            this.golden = Math.random() < 0.08;
            this.size = this.golden ? 82 : (42 + Math.random() * 36);
            this.x = Math.random() * Math.max(20, W - this.size);
            this.y = -this.size - 10;
            this.speedX = (Math.random() - 0.5) * (2.2 + difficulty * 3.2);
            this.speedY = (1.35 + Math.random() * 1.15) * (1 + difficulty * 1.35);
            if (this.golden) this.speedY *= 1.18;
            this.wobble = Math.random() * Math.PI * 2;
            this.flip = this.speedX >= 0 ? 1 : -1;
            this.caught = false;
            this.hue = this.golden ? 45 : (180 + Math.random() * 80);
        }
        update(dt) {
            this.wobble += dt * 4;
            this.y += this.speedY * dt * 60;
            this.x += (this.speedX + Math.sin(this.wobble) * 0.8) * dt * 60;
            if (this.x < 4) { this.x = 4; this.speedX = Math.abs(this.speedX); this.flip = 1; }
            if (this.x + this.size > W - 4) { this.x = W - 4 - this.size; this.speedX = -Math.abs(this.speedX); this.flip = -1; }
        }
        draw() {
            const cx = this.x + this.size / 2;
            const cy = this.y + this.size / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(Math.sin(this.wobble) * 0.12);
            ctx.scale(this.flip, 1);
            ctx.fillStyle = this.golden ? "rgba(255,210,70,.95)" : `hsla(${this.hue},70%,55%,.95)`;
            ctx.beginPath();
            ctx.moveTo(-this.size * 0.42, 0);
            ctx.quadraticCurveTo(-this.size * 0.82, -this.size * 0.28, -this.size * 0.78, 0);
            ctx.quadraticCurveTo(-this.size * 0.82, this.size * 0.28, -this.size * 0.42, 0);
            ctx.fill();
            if (this.golden) {
                ctx.shadowColor = "rgba(255,210,60,.85)";
                ctx.shadowBlur = 18;
            }
            ctx.beginPath();
            ctx.ellipse(this.size * 0.02, 0, this.size * 0.42, this.size * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            const face = this.size * 0.72;
            if (catFaceImg.complete && catFaceImg.naturalWidth) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.size * 0.08, 0, face / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(catFaceImg, this.size * 0.08 - face / 2, -face / 2, face, face);
                ctx.restore();
            } else {
                ctx.fillStyle = "#f2c48a";
                ctx.beginPath();
                ctx.arc(this.size * 0.08, 0, face / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        contains(px, py) {
            const cx = this.x + this.size / 2;
            const cy = this.y + this.size / 2;
            const hit = this.size * 0.55 + 22;
            return Math.hypot(px - cx, py - cy) < hit;
        }
    }

    function spawnFish() {
        const cap = 8 + Math.floor(Math.min(elapsed / 20000, 8));
        if (fishList.length < cap) fishList.push(new Fish());
    }

    function addSplash(x, y, golden) {
        for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 40 + Math.random() * 120;
            fx.push({
                kind: "p",
                x, y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp - 40,
                life: 1,
                r: 2 + Math.random() * 3,
                color: golden ? "#ffe28a" : "#b7ecff"
            });
        }
    }
    function addFloater(x, y, text, color) {
        fx.push({ kind: "t", x, y, vy: -42, life: 1, text, color });
    }

    function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src = e.touches && e.touches[0] ? e.touches[0] : e;
        return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    function tryCatch(e) {
        if (e.cancelable) e.preventDefault();
        if (state !== "play") return;
        const { x, y } = pointerPos(e);
        let hit = false;
        for (let i = fishList.length - 1; i >= 0; i--) {
            const f = fishList[i];
            if (f.contains(x, y)) {
                hit = true;
                const now = performance.now();
                combo = (now - lastCatch < 1400) ? combo + 1 : 1;
                lastCatch = now;
                const base = f.golden ? 50 : 10;
                const gained = base * combo;
                score += gained;
                addSplash(f.x + f.size / 2, f.y + f.size / 2, f.golden);
                addFloater(f.x + f.size / 2, f.y, (f.golden ? "GOLD +" : "+") + gained, f.golden ? "#ffe28a" : "#ffffff");
                fishList.splice(i, 1);
                shake = f.golden ? 10 : 5;
                if (f.golden) {
                    beep(740, 0.12, "triangle", 0.09);
                    beep(980, 0.16, "sine", 0.07);
                } else {
                    beep(520 + combo * 40, 0.09, "sine", 0.07);
                }
                break;
            }
        }
        if (!hit) {
            fx.push({ kind: "r", x, y, life: 1, r: 8 });
        }
        updateHud();
    }

    canvas.addEventListener("touchstart", tryCatch, { passive: false });
    canvas.addEventListener("mousedown", tryCatch);

    function updateHud() {
        scoreVal.textContent = score;
        livesEl.textContent = "\ud83d\udc3e".repeat(lives) + "\u00b7".repeat(Math.max(0, MAX_LIVES - lives));
        if (combo >= 2 && state === "play") {
            comboEl.textContent = "COMBO x" + combo;
            comboEl.classList.add("on");
        } else {
            comboEl.classList.remove("on");
        }
    }

    function startGame() {
        ensureAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        state = "play";
        overlay.classList.add("hidden");
        fishList = [];
        fx = [];
        score = 0;
        lives = MAX_LIVES;
        combo = 0;
        lastCatch = 0;
        spawnAcc = 0;
        spawnEvery = 1100;
        elapsed = 0;
        lastTs = 0;
        spawnFish();
        spawnFish();
        updateHud();
        beep(360, 0.08, "sine", 0.06);
        beep(520, 0.12, "sine", 0.05);
    }

    function gameOver() {
        state = "over";
        const hs = Number(localStorage.getItem(HS_KEY) || 0);
        const best = Math.max(hs, score);
        localStorage.setItem(HS_KEY, String(best));
        ovTitle.textContent = "Pond's closed";
        ovSub.textContent = score === 0
            ? "Nala watched the fish swim by. Try again \u2014 tap the faces, not the water."
            : "Nala is proud. The school got away, but the haul was real.";
        ovStats.innerHTML = "Score <strong>" + score + "</strong> \u00b7 Best <strong>" + best + "</strong>";
        startBtn.textContent = "Fish again";
        overlay.classList.remove("hidden");
        beep(180, 0.25, "triangle", 0.08);
    }

    startBtn.addEventListener("click", startGame);

    function drawWater(t) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#1a5a86");
        g.addColorStop(0.35, "#12486e");
        g.addColorStop(0.75, "#0b3354");
        g.addColorStop(1, "#071e33");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.globalAlpha = 0.07;
        for (let i = 0; i < 5; i++) {
            const x = (W * 0.15 * i + (t * 12 + i * 40) % (W * 0.4));
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + 70, H);
            ctx.lineTo(x + 130, H);
            ctx.lineTo(x + 40, 0);
            ctx.fillStyle = "#c6f0ff";
            ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = "rgba(180,230,255,.16)";
        ctx.fillRect(0, 0, W, 18);
        ctx.beginPath();
        ctx.moveTo(0, 18);
        for (let x = 0; x <= W; x += 16) {
            ctx.lineTo(x, 18 + Math.sin(x * 0.04 + t * 2.2) * 3.5);
        }
        ctx.lineTo(W, 0); ctx.lineTo(0, 0); ctx.closePath();
        ctx.fillStyle = "rgba(210,245,255,.22)";
        ctx.fill();
        weeds.forEach((w, i) => {
            ctx.strokeStyle = i % 2 ? "rgba(40,140,110,.35)" : "rgba(30,120,90,.28)";
            ctx.lineWidth = w.w * 0.25;
            ctx.beginPath();
            ctx.moveTo(w.x, H + 4);
            const sway = Math.sin(t * 1.4 + w.phase) * 16;
            ctx.quadraticCurveTo(w.x + sway, H - w.h * 0.5, w.x + sway * 0.4, H - w.h);
            ctx.stroke();
        });
        bubbles.forEach(b => {
            b.y -= b.s * 0.016;
            if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(200,240,255,${b.a})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
        });
    }

    function updateFx(dt) {
        for (let i = fx.length - 1; i >= 0; i--) {
            const p = fx[i];
            p.life -= dt * (p.kind === "t" ? 0.9 : 1.6);
            if (p.kind === "p") {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 180 * dt;
            } else if (p.kind === "t") {
                p.y += p.vy * dt;
            } else if (p.kind === "r") {
                p.r += 90 * dt;
            }
            if (p.life <= 0) fx.splice(i, 1);
        }
    }

    function drawFx() {
        fx.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            if (p.kind === "p") {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            } else if (p.kind === "t") {
                ctx.fillStyle = p.color;
                ctx.font = "bold 20px Trebuchet MS, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(p.text, p.x, p.y);
            } else if (p.kind === "r") {
                ctx.strokeStyle = "rgba(200,235,255,.6)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        });
        ctx.textAlign = "start";
    }

    function gameLoop(ts) {
        if (!lastTs) lastTs = ts;
        let dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;
        const t = ts / 1000;
        if (shake > 0) shake *= 0.86;
        ctx.save();
        if (shake > 0.4) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }
        drawWater(t);
        if (state === "play") {
            elapsed += dt * 1000;
            spawnEvery = Math.max(380, 1100 - elapsed / 95);
            spawnAcc += dt * 1000;
            while (spawnAcc >= spawnEvery) {
                spawnAcc -= spawnEvery;
                spawnFish();
            }
            if (performance.now() - lastCatch > 1400) combo = 0;
            for (let i = fishList.length - 1; i >= 0; i--) {
                const f = fishList[i];
                f.update(dt);
                if (f.y > H + f.size) {
                    fishList.splice(i, 1);
                    lives -= 1;
                    combo = 0;
                    addFloater(Math.max(40, Math.min(W - 40, f.x)), H - 40, "escaped", "#ffb3b3");
                    beep(140, 0.18, "sawtooth", 0.04);
                    updateHud();
                    if (lives <= 0) gameOver();
                }
            }
        } else if (state === "menu") {
            if (fishList.length < 5 && Math.random() < 0.03) spawnFish();
            fishList.forEach(f => f.update(dt * 0.55));
            fishList = fishList.filter(f => f.y < H + f.size);
        }
        fishList.forEach(f => f.draw());
        updateFx(dt);
        drawFx();
        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    (function initMenu() {
        const hs = Number(localStorage.getItem(HS_KEY) || 0);
        if (hs) ovStats.innerHTML = "Best haul <strong>" + hs + "</strong>";
        updateHud();
        requestAnimationFrame(gameLoop);
    })();
    </script>
</body>
</html>
