<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>I See You — The Pack</title>
<style>
  :root { --ink:#0b0b0c; --paper:#f1eee8; --lamp:#ece8e0; --gold:#f4d35e; }
  html,body { margin:0; height:100%; background:#071018; color:var(--paper); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; inset:0 0 auto 0; padding:12px 14px calc(8px + env(safe-area-inset-top)); display:flex; justify-content:space-between; pointer-events:none; text-shadow:0 2px 8px #000; }
  #hud b { color:var(--gold); }
  #toast { position:fixed; left:50%; top:18%; transform:translateX(-50%); background:rgba(11,11,12,.78); padding:10px 16px; border-radius:999px; font-size:18px; opacity:0; transition:opacity .25s; pointer-events:none; letter-spacing:.02em; }
  #toast.show { opacity:1; }
  #start, #over { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(7,16,24,.82); text-align:center; padding:24px; }
  #over { display:none; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { max-width:340px; line-height:1.4; opacity:.9; }
  button { margin-top:16px; background:var(--gold); color:#1a1204; border:0; font-weight:700; font-size:18px; padding:12px 22px; border-radius:999px; }
  .tiny { font-size:13px; opacity:.7; margin-top:10px; }
</style>
</head>
<body>
<div id="hud"><div>Score <b id="score">0</b></div><div>Nala lights <b id="nalas">0</b></div></div>
<div id="toast"></div>
<div id="start">
  <h1>I See You, Jada</h1>
  <p>You and Travis roam the pond like Pac-Man. Eat the gold crumbs. When you find Jada, say it out loud. When Nala’s spirit drifts through — she’s home for a second.</p>
  <button id="go">Cast us in</button>
  <div class="tiny">Swipe or arrow keys · tap to chomp</div>
</div>
<div id="over">
  <h1>The pack settled</h1>
  <p id="final"></p>
  <button id="again">Play again</button>
</div>
<canvas id="c"></canvas>

const loaded = {};
function loadAll(cb){
  let n = 0, keys = Object.keys(IMG);
  keys.forEach(k => {
    const im = new Image();
    im.onload = () => { loaded[k]=im; if(++n===keys.length) cb(); };
    im.src = IMG[k];
  });
}
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H,dpr=1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  W = canvas.width = Math.floor(innerWidth*dpr);
  H = canvas.height = Math.floor(innerHeight*dpr);
}
resize(); addEventListener('resize', resize);
const DIRS = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
let state = 'menu', score=0, nalaCount=0, pellets=[];
let mike, travis, jada, nala;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 1800);
}
function makeActor(kind, x, y, speed){
  return { kind, x, y, vx:speed, vy:0, speed, r: 28*dpr, mouth:0, say:0 };
}
function reset(){
  score=0; nalaCount=0; pellets=[];
  const midx=W/2, midy=H*0.55;
  mike = makeActor('mike', midx-80*dpr, midy, 2.4*dpr);
  travis = makeActor('travis', midx+80*dpr, midy, 2.2*dpr);
  travis.vx = -travis.speed;
  jada = makeActor('jada', W*0.2, H*0.3, 1.4*dpr);
  jada.vy = jada.speed;
  nala = { x: W*0.8, y: H*0.25, r:26*dpr, visible:false, t:0 };
  for(let i=0;i<48;i++){
    pellets.push({ x: 40*dpr + Math.random()*(W-80*dpr), y: 80*dpr + Math.random()*(H-140*dpr), r: 4*dpr, gold: Math.random()<0.12 });
  }
}
function bounce(a){
  a.x += a.vx; a.y += a.vy;
  if(a.x < a.r || a.x > W-a.r) a.vx *= -1;
  if(a.y < a.r+40*dpr || a.y > H-a.r) a.vy *= -1;
  a.x = Math.max(a.r, Math.min(W-a.r, a.x));
  a.y = Math.max(a.r+40*dpr, Math.min(H-a.r, a.y));
  a.mouth += 0.18;
}
function setDir(a, dx, dy){
  const len = Math.hypot(dx,dy) || 1;
  a.vx = (dx/len)*a.speed; a.vy = (dy/len)*a.speed;
}
function drawWater(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#12355a'); g.addColorStop(1,'#071018');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(180,220,255,.08)'; ctx.lineWidth=2;
  for(let y=80;y<H;y+=46*dpr){
    ctx.beginPath();
    for(let x=0;x<=W;x+=20){ ctx.lineTo(x, y + Math.sin(x*0.01 + performance.now()/700 + y)*4*dpr); }
    ctx.stroke();
  }
}
function drawHead(a){
  const im = loaded[a.kind];
  const chomp = 0.15 + Math.abs(Math.sin(a.mouth))*0.35;
  ctx.save(); ctx.translate(a.x, a.y);
  ctx.rotate(Math.atan2(a.vy, a.vx));
  ctx.beginPath(); ctx.arc(0,0,a.r, chomp, Math.PI*2-chomp); ctx.lineTo(0,0); ctx.closePath(); ctx.clip();
  if(im) ctx.drawImage(im, -a.r, -a.r, a.r*2, a.r*2);
  else { ctx.fillStyle='#f4d35e'; ctx.fill(); }
  ctx.restore();
  if(a.say>0){
    ctx.font = (13*dpr)+'px ui-rounded, sans-serif';
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.fillText('I see you Jada', a.x, a.y - a.r - 10*dpr);
    a.say -= 0.016;
  }
}
function drawJada(){
  const im = loaded.jada;
  ctx.save();
  ctx.beginPath(); ctx.arc(jada.x, jada.y, jada.r+4*dpr, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,220,160,.15)'; ctx.fill();
  if(im) ctx.drawImage(im, jada.x-jada.r, jada.y-jada.r, jada.r*2, jada.r*2);
  ctx.restore();
}
function drawNala(){
  if(!nala.visible) return;
  const pulse = 1 + Math.sin(performance.now()/200)*0.08;
  const r = nala.r * pulse;
  ctx.save();
  ctx.globalAlpha = 0.55 + Math.sin(performance.now()/180)*0.25;
  ctx.beginPath(); ctx.arc(nala.x, nala.y, r+8*dpr, 0, Math.PI*2);
  ctx.fillStyle='rgba(200,230,255,.25)'; ctx.fill();
  if(loaded.nala) ctx.drawImage(loaded.nala, nala.x-r, nala.y-r, r*2, r*2);
  ctx.restore();
}
function eatPellets(a){
  for(let i=pellets.length-1;i>=0;i--){
    const p = pellets[i];
    if(Math.hypot(a.x-p.x, a.y-p.y) < a.r){ score += p.gold ? 50 : 10; pellets.splice(i,1); }
  }
}
function maybeSeeJada(a){
  if(Math.hypot(a.x-jada.x, a.y-jada.y) < a.r + jada.r + 8*dpr){
    if(a.say<=0){ a.say = 1.6; score += 25; toast('I see you Jada'); }
  }
}
function spawnNala(){
  nala.visible = true;
  nala.x = 40*dpr + Math.random()*(W-80*dpr);
  nala.y = 80*dpr + Math.random()*(H-160*dpr);
  nala.t = 6;
}
function catchNala(a){
  if(!nala.visible) return;
  if(Math.hypot(a.x-nala.x, a.y-nala.y) < a.r + nala.r){
    nala.visible=false; nalaCount++; score += 200;
    toast('Nala\u2019s here \u2014 just for a minute');
  }
}
function loop(now){
  requestAnimationFrame(loop);
  drawWater();
  if(state!=='play') return;
  if(Math.random()<0.02){ const ang = Math.random()*Math.PI*2; setDir(travis, Math.cos(ang), Math.sin(ang)); }
  if(Math.random()<0.01){ setDir(travis, jada.x-travis.x, jada.y-travis.y); }
  if(Math.random()<0.015){ const ang = Math.random()*Math.PI*2; setDir(jada, Math.cos(ang), Math.sin(ang)); }
  bounce(mike); bounce(travis); bounce(jada);
  eatPellets(mike); eatPellets(travis);
  maybeSeeJada(mike); maybeSeeJada(travis);
  catchNala(mike); catchNala(travis);
  if(nala.visible){
    nala.t -= 0.016;
    nala.x += Math.sin(now/400)*0.4*dpr;
    nala.y += Math.cos(now/500)*0.3*dpr;
    if(nala.t<=0) nala.visible=false;
  } else if(Math.random()<0.004){ spawnNala(); }
  pellets.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = p.gold ? '#f4d35e' : 'rgba(255,255,255,.75)'; ctx.fill(); });
  drawJada(); drawNala(); drawHead(mike); drawHead(travis);
  document.getElementById('score').textContent = score;
  document.getElementById('nalas').textContent = nalaCount;
  if(pellets.length===0){
    state='over';
    document.getElementById('over').style.display='flex';
    document.getElementById('final').textContent = 'Score '+score+' \u00b7 Nala visited '+nalaCount+' time'+(nalaCount===1?'':'s')+'. The house is still full.';
  }
}
function pointerDir(e){
  const r = canvas.getBoundingClientRect();
  const x = ((e.touches?e.touches[0].clientX:e.clientX) - r.left) * (W/r.width);
  const y = ((e.touches?e.touches[0].clientY:e.clientY) - r.top) * (H/r.height);
  setDir(mike, x-mike.x, y-mike.y);
}
canvas.addEventListener('pointerdown', pointerDir);
canvas.addEventListener('pointermove', e => { if(e.buttons||e.pressure) pointerDir(e); });
addEventListener('keydown', e=>{
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down' };
  if(map[e.key]){ const [dx,dy]=DIRS[map[e.key]]; setDir(mike, dx, dy); }
});
document.getElementById('go').onclick = ()=>{ document.getElementById('start').style.display='none'; reset(); state='play'; };
document.getElementById('again').onclick = ()=>{ document.getElementById('over').style.display='none'; reset(); state='play'; };
loadAll(()=> requestAnimationFrame(loop));
</script>
</body>
